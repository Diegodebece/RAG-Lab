                  id: 3f2b8c1e-5d4a-4f6b-9a7c-1e2d3c4b5a69
                  name: Precise
                  settings:
                    topK: 5
                  problems: []
                  createdAt: "2026-11-27T12:00:00.000Z"
                  updatedAt: "2026-11-27T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
