      description: |
        Changes `name` and/or `settings`; at least one is required. The `settings` sent replace the stored ones as a
        whole: a setting that is not sent is gone and takes the default again, and `{}` empties them. A rename alone
        leaves the settings as they are, even when they are outside today's caps. The rules for the name are those
        of `POST /v1/profiles`; renaming a profile to its own name in another capitalization is allowed.

        A profile saved by another configuration version cannot be changed (409); it can still be read and deleted.

        The body is read up to 16 kB; a bigger one is a 413.
      requestBody:
        required: true
